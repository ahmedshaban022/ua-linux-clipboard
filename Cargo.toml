[workspace]
resolver = "2"
members = [
    "crates/ua-core",
    "crates/ua-daemon",
    "crates/ua-gtk",
    "crates/ua-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ua/ua-linux-clipboard"

[profile.release]
lto = "thin"
strip = true
